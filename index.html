<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Link WhatsApp Avançado</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#25D366">
</head>
<body>

    <div class="container">
        <header>
            <h1>Gerador Avançado de Link WhatsApp</h1>
            <p>Crie links, QR Codes e templates com preview em tempo real.</p>
            <button id="theme-toggle" class="btn-toggle">Alternar Tema 🌙</button>
        </header>

        <div class="app-container">
            <div class="card" id="input-section">
                <h2>Crie seu Link</h2>
                <div class="form-group">
                    <label for="phone">Número do WhatsApp (com DDI)</label>
                    <input type="tel" id="phone" placeholder="Ex: 5511912345678">
                </div>
                <div class="form-group">
                    <label for="message">Mensagem Predefinida</label>
                    <textarea id="message" rows="4" placeholder="Digite sua mensagem..."></textarea>
                </div>

                <h3>Templates</h3>
                <div class="templates-container" id="default-templates">
                    <button class="template-btn">👋 Olá! Vim pelo site.</button>
                    <button class="template-btn">🛍️ Tenho interesse no produto.</button>
                    <button class="template-btn">💬 Preciso de suporte.</button>
                </div>

                <h3>Seus Templates</h3>
                <div class="form-group" id="custom-template-form">
                    <input type="text" id="template-name" placeholder="Nome do template (ex: Vendas)">
                    <button id="save-template" class="btn-primary">Salvar Template Atual</button>
                </div>
                <div class="templates-container" id="custom-templates">
                    </div>
            </div>

            <div class="card" id="preview-section">
                <h2>Preview</h2>

                <label>Preview da Mensagem no WhatsApp</label>
                <div class="whatsapp-preview">
                    <div class="whatsapp-chat">
                        <span id="preview-message">Sua mensagem aparecerá aqui...</span>
                    </div>
                </div>

                <label>Seu Link Gerado</label>
                <div class="form-group result-group">
                    <input type="text" id="generated-link" readonly value="Aguardando número...">
                    <button id="copy-link">Copiar</button>
                </div>

                <label>QR Code</label>
                <div id="qrcode-container">
                    <div id="qrcode"></div>
                </div>

                <div class="qr-options">
                    <div class="form-group">
                        <label for="qr-color">Cor do QR Code:</label>
                        <input type="color" id="qr-color" value="#000000">
                    </div>
                    <button id="download-qr" class="btn-secondary">Baixar QR Code (PNG)</button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
